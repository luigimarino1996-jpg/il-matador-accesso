<!DOCTYPE html>
<html lang="it" data-landing="entra">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07080c">
<link rel="icon" href="/avatar.jpg">
<title>Il Matador 🇮🇹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07080c;--text:#f5f7fb;--muted:#8b93a7;--glass:rgba(255,255,255,.05);--stroke:rgba(255,255,255,.09);
        --tg1:#37bbfe;--tg2:#007dbb;--gold1:#ffe08a;--gold2:#f5a524;--green:#22c55e}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  html{-webkit-font-smoothing:antialiased}
  body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;
       display:flex;justify-content:center}

  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
  .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;animation:float 14s ease-in-out infinite}
  .o1{width:340px;height:340px;background:#1d6fff;top:-120px;left:-110px}
  .o2{width:300px;height:300px;background:#f5a524;top:40%;right:-150px;opacity:.25;animation-delay:-5s}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:34px 34px;
        mask-image:radial-gradient(ellipse at top,#000 30%,transparent 75%)}
  @keyframes float{50%{transform:translate(30px,40px) scale(1.1)}}

  /* tutto in una schermata */
  main{width:100%;max-width:420px;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
       padding:max(20px,env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom))}
  .top{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,24px)}
  .reveal{opacity:0;transform:translateY(12px);animation:in .6s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes in{to{opacity:1;transform:none}}

  .avatar{position:relative;width:clamp(84px,14vh,112px);aspect-ratio:1}
  .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
  .avatar::after{content:"";position:absolute;inset:-4px;border-radius:50%;padding:3px;
                 background:conic-gradient(var(--tg1),var(--gold2),var(--green),var(--tg1));
                 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
                 animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pname{font-size:18px;font-weight:700;margin-top:-6px}
  .psubs{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:center;margin-top:4px}
  .live{width:7px;height:7px;border-radius:50%;background:var(--green);animation:ping 1.8s infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}70%,100%{box-shadow:0 0 0 7px rgba(34,197,94,0)}}

  h1{font-size:clamp(30px,5vh,40px);line-height:1.05;font-weight:900;letter-spacing:-.035em}
  .grad{background:linear-gradient(100deg,var(--gold1),var(--gold2) 60%,#ff7a45);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:17px;line-height:1.45;color:var(--muted);max-width:330px}
  .sub b{color:var(--text)}

  /* pulsante */
  .bottom{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:clamp(26px,5vh,44px)}
  .down{font-size:15px;font-weight:700;color:var(--tg1);display:flex;align-items:center;gap:8px}
  .down span{display:inline-block;font-size:22px;animation:bob 1.1s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(6px)}}
  .cta{position:relative;overflow:hidden;width:100%;border:0;border-radius:18px;padding:20px;cursor:pointer;
       font:900 18px Inter,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;
       background:linear-gradient(135deg,var(--tg1),var(--tg2));
       box-shadow:0 10px 30px -6px rgba(55,187,254,.6),inset 0 1px 0 rgba(255,255,255,.3)}
  .cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
              background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 2.8s infinite}
  @keyframes shine{60%,100%{left:130%}}
  .cta:active{transform:scale(.98)}
  .cta svg{width:24px;height:24px;flex:none}
  .fallback{font-size:13px;color:var(--tg1);font-weight:700}
  .fallback[hidden]{display:none}
  .error{font-size:12px;color:#ff8a8a}
  .error:empty{display:none}
  .cta[disabled]{opacity:.8;cursor:progress}
  .hint{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="grid"></div></div>

<main>
  <div class="top">
    <div class="reveal">
      <div class="avatar" style="margin:0 auto"><img src="/avatar-tondo.jpg" alt="Il Matador"></div>
    </div>
    <div class="reveal" style="animation-delay:.06s">
      <div class="pname">Il Matador 🇮🇹</div>
      <div class="psubs"><span class="live"></span>41 932 iscritti su Telegram</div>
    </div>
    <h1 class="reveal" style="animation-delay:.12s">La password del mio <span class="grad">conto reale</span></h1>
    <p class="sub reveal" style="animation-delay:.18s">La trovi nel mio <b>canale Telegram</b>. Per entrare <b>tocca il pulsante blu qui sotto</b>.</p>
  </div>

  <div class="bottom reveal" style="animation-delay:.24s">
    <div class="down"><span>👇</span>Tocca qui per entrare<span>👇</span></div>
    <button class="cta" id="cta">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M9.8 15.6l-.4 5.4c.6 0 .8-.2 1.1-.5l2.6-2.5 5.4 4c1 .5 1.7.3 2-.9L24 3.9c.4-1.5-.6-2.2-1.6-1.8L1.2 10.2c-1.4.6-1.4 1.4-.2 1.8l5.4 1.7L19 5.8c.6-.4 1.1-.2.7.2"/></svg>
      <span id="cta-label">ENTRA NEL CANALE</span>
    </button>
    <div class="hint">Si apre Telegram · gratis</div>
    <a class="fallback" id="fallback" hidden>Telegram non si apre? Tocca qui</a>
    <div class="error" id="error" role="alert"></div>
  </div>
</main>

<script>
  // Meta Pixel: ID ed evento sul clic arrivano dal server (variabili su Netlify).
  let clickEvent = "";
  fetch("/api/config")
    .then((r) => r.json())
    .then((config) => {
      const { pixelId } = config;
      clickEvent = config.clickEvent || "";
      // Microsoft Clarity (CLARITY_ID su Netlify); ogni sessione porta il nome della landing.
      if (/^[a-z0-9]{6,20}$/i.test(config.clarityId || "")) {
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", config.clarityId);
        clarity("set", "landing", document.documentElement.dataset.landing || "");
      }
      if (!pixelId) return;
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq("init", pixelId);
      fbq("track", "PageView");
    })
    .catch(() => {});

  const button = document.getElementById("cta");
  const label = document.getElementById("cta-label");
  const error = document.getElementById("error");
  const fallback = document.getElementById("fallback");
  const cookie = (name) =>
    document.cookie.split("; ").find((c) => c.startsWith(name + "="))?.split("=")[1] ?? "";
  const reset = () => { button.disabled = false; label.textContent = "ENTRA NEL CANALE"; };

  button.addEventListener("click", async () => {
    button.disabled = true;
    label.textContent = "ATTENDI…";
    error.textContent = "";
    try {
      // Same id in the browser and on the server, so Meta counts the click event once.
      const eventId = "click-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      if (clickEvent && window.fbq) fbq("track", clickEvent, {}, { eventID: eventId });
      const fbclid = new URLSearchParams(location.search).get("fbclid");
      const res = await fetch("/api/join", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          event_id: eventId,
          url: location.href,
          fbp: cookie("_fbp"),
          fbc: cookie("_fbc") || (fbclid ? `fb.1.${Date.now()}.${fbclid}` : ""),
        }),
      });
      const data = await res.json();
      if (!data.link) throw new Error("no link");
      // Open the Telegram app directly; if the page is still visible after a moment,
      // the app didn't open, so fall back to the web link (same personal invite).
      const code = data.link.split("/").pop().replace(/^\+/, "");
      fallback.href = data.link;
      fallback.hidden = false;
      location.href = `tg://join?invite=${encodeURIComponent(code)}`;
      setTimeout(() => { if (!document.hidden) location.href = data.link; }, 1500);
      // If the visitor comes back to this page, the button works again.
      setTimeout(reset, 3000);
    } catch {
      error.textContent = "Qualcosa non ha funzionato. Riprova tra qualche secondo.";
      reset();
    }
  });
</script>
</body>
</html>
