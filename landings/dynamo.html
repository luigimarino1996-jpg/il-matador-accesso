<!DOCTYPE html>
<html lang="it" data-landing="dynamo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il Matador 🇮🇹 · Canale Telegram</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1424">
<link rel="icon" href="/avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 12px 12px max(12px, env(safe-area-inset-bottom));
    font-family: "Outfit", system-ui, -apple-system, sans-serif;
    color: #fff;
    background-color: #0a1222;
    background-image:
      radial-gradient(120% 60% at 50% 0%, rgba(56, 120, 190, .45) 0%, transparent 60%),
      radial-gradient(100% 60% at 80% 100%, rgba(108, 60, 210, .45) 0%, transparent 65%),
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: auto, auto, 44px 44px, 44px 44px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    padding: 26px 20px 20px;
    text-align: center;
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, .14);
    background: linear-gradient(180deg, rgba(48, 98, 150, .55) 0%, rgba(30, 36, 70, .55) 50%, rgba(52, 36, 110, .6) 100%);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .08);
    backdrop-filter: blur(8px);
  }

  /* Photo with gradient ring and Telegram badge */
  .avatar-wrap {
    position: relative;
    width: clamp(126px, 21vh, 168px);
    height: clamp(126px, 21vh, 168px);
    margin: 0 auto 20px;
    padding: 6px;
    border-radius: 50%;
    background: conic-gradient(from 200deg, #3fd6c5, #3c9ee8, #4f6cf0, #7a4cf0, #3fd6c5);
    box-shadow: 0 0 60px rgba(64, 150, 230, .35);
  }
  .avatar-wrap::before {
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: #070b14;
  }
  .avatar {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid #070b14;
  }
  .badge {
    position: absolute;
    right: 2px;
    bottom: 2px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #3a9be6;
    border: 4px solid #070b14;
  }
  .badge svg { width: 21px; height: 21px; margin-left: -2px; }

  h1 {
    margin: 0 0 18px;
    font-size: clamp(1.42rem, 6.1vw, 1.75rem);
    line-height: 1.12;
    font-weight: 800;
    letter-spacing: -.02em;
  }
  .glow { color: #6fd2ff; text-shadow: 0 0 22px rgba(111, 210, 255, .55); }
  .brand { display: block; color: #f6f43c; }

  h2 {
    margin: 0 0 16px;
    font-family: "Montserrat", system-ui, sans-serif;
    font-size: clamp(1.25rem, 5.7vw, 1.6rem);
    line-height: 1.12;
    font-weight: 900;
    letter-spacing: .01em;
    text-transform: uppercase;
  }
  h2 span { color: #8ef0ff; }

  .arrow {
    width: 44px;
    height: 44px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .3);
    display: grid;
    place-items: center;
    animation: bob 1.6s ease-in-out infinite;
  }
  .arrow svg { width: 20px; height: 20px; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .arrow { animation: none; } }

  .button {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px 18px;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    font-family: "Montserrat", system-ui, sans-serif;
    font-weight: 900;
    font-size: clamp(1.02rem, 4.5vw, 1.15rem);
    letter-spacing: .09em;
    color: #fff;
    background: linear-gradient(90deg, #4aa7e8 0%, #4d8fe6 55%, #6a45ec 100%);
    box-shadow: 0 12px 34px rgba(80, 120, 240, .45);
    transition: transform .1s, filter .15s;
  }
  .button svg { width: 26px; height: 26px; flex: none; }
  .button:hover { filter: brightness(1.06); }
  .button:active { transform: scale(.98); }
  .button[disabled] { opacity: .75; cursor: progress; }

  .note { margin: 10px 0 0; font-family: "Montserrat", system-ui, sans-serif; font-weight: 600; font-size: .94rem; color: rgba(255, 255, 255, .88); }
  .fallback { display: block; margin: 14px 0 0; font-size: .95rem; color: #8ef0ff; }
  .fallback[hidden] { display: none; }
  .error { min-height: 0; margin: 6px 0 0; font-size: .92rem; color: #ff8a8a; }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar-wrap">
      <img class="avatar" src="/avatar.jpg" alt="Il Matador" width="212" height="212">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M21.4 3.6 2.9 10.8c-1 .4-1 1.8.1 2.1l4.7 1.5 1.8 5.6c.3.9 1.4 1.1 2 .4l2.6-2.6 4.8 3.5c.8.6 1.9.1 2.1-.8l3-15.2c.2-1.2-.9-2.1-2.6-1.7Zm-3.5 4.3-8.2 7.4-.3 3-1.3-4 9.4-6.8c.4-.3.8.1.4.4Z"/></svg>
      </span>
    </div>

    <h1>Scopri come sto generando <span class="glow">profitti</span> ogni mese grazie al mio software <span class="brand">Dynamo.</span></h1>

    <h2>Entra all'interno del <span>canale Telegram</span></h2>

    <div class="arrow" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M5.5 12.5 12 19l6.5-6.5"/></svg>
    </div>

    <button class="button" id="join" type="button">
      <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M21.4 3.6 2.9 10.8c-1 .4-1 1.8.1 2.1l4.7 1.5 1.8 5.6c.3.9 1.4 1.1 2 .4l2.6-2.6 4.8 3.5c.8.6 1.9.1 2.1-.8l3-15.2c.2-1.2-.9-2.1-2.6-1.7Zm-3.5 4.3-8.2 7.4-.3 3-1.3-4 9.4-6.8c.4-.3.8.1.4.4Z"/></svg>
      <span id="join-label">ACCEDI AL CANALE</span>
    </button>
    <p class="note">Accesso gratuito · Posti limitati</p>
    <a class="fallback" id="fallback" hidden>Telegram non si apre? Tocca qui</a>
    <p class="error" id="error" role="alert"></p>
  </main>

<script>
  // Meta Pixel: ID ed evento sul clic arrivano dal server (variabili su Netlify).
  let clickEvent = "";
  fetch("/api/config")
    .then((r) => r.json())
    .then((config) => {
      const { pixelId } = config;
      clickEvent = config.clickEvent || "";
      // Microsoft Clarity (CLARITY_ID su Netlify); ogni sessione porta il nome della landing.
      if (/^[a-z0-9]{6,20}$/i.test(config.clarityId || "")) {
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", config.clarityId);
        clarity("set", "landing", document.documentElement.dataset.landing || "");
      }
      if (!pixelId) return;
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq("init", pixelId);
      fbq("track", "PageView");
    })
    .catch(() => {});

  const button = document.getElementById("join");
  const label = document.getElementById("join-label");
  const error = document.getElementById("error");
  const fallback = document.getElementById("fallback");
  const cookie = (name) =>
    document.cookie.split("; ").find((c) => c.startsWith(name + "="))?.split("=")[1] ?? "";
  const reset = () => { button.disabled = false; label.textContent = "ACCEDI AL CANALE"; };

  button.addEventListener("click", async () => {
    button.disabled = true;
    label.textContent = "ATTENDI…";
    error.textContent = "";
    try {
      // Same id in the browser and on the server, so Meta counts the click event once.
      const eventId = "click-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      if (clickEvent && window.fbq) fbq("track", clickEvent, {}, { eventID: eventId });
      const fbclid = new URLSearchParams(location.search).get("fbclid");
      const res = await fetch("/api/join", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          event_id: eventId,
          url: location.href,
          fbp: cookie("_fbp"),
          fbc: cookie("_fbc") || (fbclid ? `fb.1.${Date.now()}.${fbclid}` : ""),
        }),
      });
      const data = await res.json();
      if (!data.link) throw new Error("no link");
      // Open the Telegram app directly; the web link stays as a fallback below the button.
      const code = data.link.split("/").pop().replace(/^\+/, "");
      fallback.href = data.link;
      fallback.hidden = false;
      location.href = `tg://join?invite=${encodeURIComponent(code)}`;
      // If the visitor comes back to this page, the button works again.
      setTimeout(reset, 3000);
    } catch {
      error.textContent = "Qualcosa non ha funzionato. Riprova tra qualche secondo.";
      reset();
    }
  });
</script>
</body>
</html>
