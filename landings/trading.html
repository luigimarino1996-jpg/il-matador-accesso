<!DOCTYPE html>
<html lang="it" data-landing="trading">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0f1c">
<link rel="icon" href="/avatar-trading.jpg">
<title>Il Matador 🇮🇹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Montserrat:wght@500;800;900&display=swap" rel="stylesheet">
<style>
  :root{--sky:#7fe0f5;--yel:#fff23a;--b1:#4fa8ea;--b2:#6a3cf0}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#070a14;color:#fff;font-family:Montserrat,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;
       display:flex;align-items:center;justify-content:center;
       padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
       background:radial-gradient(120% 60% at 50% 0%,#123a5c 0%,transparent 60%),
                  radial-gradient(90% 55% at 100% 100%,#3b1d78 0%,transparent 65%),
                  radial-gradient(70% 50% at 0% 85%,#0d4a3c 0%,transparent 70%),#081022}
  .bg::before{content:"";position:absolute;inset:0;
       background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
       background-size:40px 40px}

  .card{width:100%;max-width:420px;max-height:100%;border-radius:30px;border:1px solid rgba(255,255,255,.14);
        background:linear-gradient(180deg,rgba(44,91,128,.62) 0%,rgba(22,34,56,.58) 45%,rgba(42,42,92,.62) 78%,rgba(58,36,112,.72) 100%);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
        box-shadow:0 30px 80px -20px rgba(80,60,220,.45),inset 0 1px 0 rgba(255,255,255,.12);
        display:flex;flex-direction:column;align-items:center;text-align:center;
        padding:clamp(22px,4vh,36px) 22px clamp(20px,3.6vh,32px);gap:clamp(13px,2.7vh,24px)}

  .avatar{flex:none;position:relative;width:clamp(108px,19vh,152px);aspect-ratio:1;border-radius:50%;padding:5px;
          background:linear-gradient(160deg,#5ee0d0,#4f8ff0 50%,#7a3cf0);box-shadow:0 0 50px rgba(79,168,234,.35)}
  .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:5px solid #0b1120;display:block}
  .tg{position:absolute;right:2%;bottom:2%;width:28%;aspect-ratio:1;border-radius:50%;background:#4fa3e0;border:4px solid #0b1120;
      display:grid;place-items:center}
  .tg svg{width:52%;height:52%}

  h1{font-family:Outfit,sans-serif;font-weight:800;font-size:clamp(21px,3.3vh,26px);line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
  .sky{color:var(--sky);text-shadow:0 0 18px rgba(127,224,245,.45)}
  .yel{color:var(--yel)}

  h2{font-weight:900;font-size:clamp(20px,3.1vh,25px);line-height:1.12;text-transform:uppercase;letter-spacing:.01em}
  h2 span{color:var(--sky)}

  .arrow{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;
         animation:bob 1.3s ease-in-out infinite}
  .arrow svg{width:20px;height:20px}
  @keyframes bob{50%{transform:translateY(7px)}}

  .cta-box{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
  .cta{position:relative;overflow:hidden;width:100%;border:0;border-radius:999px;padding:19px 16px;cursor:pointer;
       font:900 17px Montserrat,sans-serif;letter-spacing:.08em;color:#fff;display:flex;align-items:center;justify-content:center;gap:14px;
       background:linear-gradient(90deg,var(--b1) 0%,#4f8fe6 55%,var(--b2) 100%);
       box-shadow:0 12px 34px -8px rgba(90,110,240,.7),inset 0 1px 0 rgba(255,255,255,.25)}
  .cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
              background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3s infinite}
  @keyframes shine{60%,100%{left:130%}}
  .cta:active{transform:scale(.98)}
  .cta svg{width:24px;height:24px;flex:none}
  .error{font-size:12px;color:#ff8a8a}
  .error:empty{display:none}
  .cta[disabled]{opacity:.8;cursor:progress}
  .note{font-weight:500;font-size:14px;color:rgba(255,255,255,.85)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="avatar">
    <img src="/avatar-trading.jpg" alt="Il Matador">
    <div class="tg"><svg viewBox="0 0 24 24" fill="#fff"><path d="M9.8 15.6l-.4 5.4c.6 0 .8-.2 1.1-.5l2.6-2.5 5.4 4c1 .5 1.7.3 2-.9L24 3.9c.4-1.5-.6-2.2-1.6-1.8L1.2 10.2c-1.4.6-1.4 1.4-.2 1.8l5.4 1.7L19 5.8c.6-.4 1.1-.2.7.2"/></svg></div>
  </div>

  <h1>Scopri come migliaia di persone stanno ottenendo un' <span class="sky">entrata extra</span> ogni mese <span class="yel">seguendo le mie operazioni di Trading</span></h1>

  <h2>Entra all'interno del <span>canale Telegram</span></h2>

  <div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M5 12l7 7 7-7"/></svg></div>

  <div class="cta-box">
    <button class="cta" id="cta">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M9.8 15.6l-.4 5.4c.6 0 .8-.2 1.1-.5l2.6-2.5 5.4 4c1 .5 1.7.3 2-.9L24 3.9c.4-1.5-.6-2.2-1.6-1.8L1.2 10.2c-1.4.6-1.4 1.4-.2 1.8l5.4 1.7L19 5.8c.6-.4 1.1-.2.7.2"/></svg>
      <span id="cta-label">ACCEDI AL CANALE</span>
    </button>
    <div class="note">Accesso gratuito · Posti limitati</div>
    <div class="error" id="error" role="alert"></div>
  </div>
</div>

<script>
  // Meta Pixel: ID ed evento sul clic arrivano dal server (variabili su Netlify).
  let clickEvent = "";
  fetch("/api/config")
    .then((r) => r.json())
    .then((config) => {
      const { pixelId } = config;
      clickEvent = config.clickEvent || "";
      // Microsoft Clarity (CLARITY_ID su Netlify); ogni sessione porta il nome della landing.
      if (/^[a-z0-9]{6,20}$/i.test(config.clarityId || "")) {
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", config.clarityId);
        clarity("set", "landing", document.documentElement.dataset.landing || "");
      }
      if (!pixelId) return;
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq("init", pixelId);
      // Optional second pixel (EXTRA_PIXEL_ID): receives PageView and the click event from the browser.
      if (/^\d{10,20}$/.test(config.extraPixelId || "")) fbq("init", config.extraPixelId);
      fbq("track", "PageView");
    })
    .catch(() => {});

  const button = document.getElementById("cta");
  const label = document.getElementById("cta-label");
  const error = document.getElementById("error");
  const cookie = (name) =>
    document.cookie.split("; ").find((c) => c.startsWith(name + "="))?.split("=")[1] ?? "";
  const reset = () => { button.disabled = false; label.textContent = "ACCEDI AL CANALE"; };

  button.addEventListener("click", async () => {
    button.disabled = true;
    label.textContent = "ATTENDI…";
    error.textContent = "";
    try {
      // Same id in the browser and on the server, so Meta counts the click event once.
      const eventId = "click-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      if (clickEvent && window.fbq) fbq("track", clickEvent, {}, { eventID: eventId });
      const fbclid = new URLSearchParams(location.search).get("fbclid");
      const res = await fetch("/api/join", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          event_id: eventId,
          url: location.href,
          fbp: cookie("_fbp"),
          fbc: cookie("_fbc") || (fbclid ? `fb.1.${Date.now()}.${fbclid}` : ""),
        }),
      });
      const data = await res.json();
      if (!data.link) throw new Error("no link");
      // Normal Telegram link (t.me), no direct app opening.
      location.href = data.link;
      // If the visitor comes back to this page, the button works again.
      setTimeout(reset, 3000);
    } catch {
      error.textContent = "Qualcosa non ha funzionato. Riprova tra qualche secondo.";
      reset();
    }
  });
</script>
</body>
</html>
