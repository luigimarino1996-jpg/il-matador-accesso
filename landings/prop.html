<!doctype html>
<html lang="it" data-landing="prop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accedi al canale Telegram</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/avatar-prop.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Montserrat:wght@500;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0f1f}
a{color:#fff}a:hover{color:#fff}
.dc-cta{transition:transform .15s ease, box-shadow .15s ease}
.dc-cta:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(99,102,241,.55)}
.dc-arrow{animation:dcb 1.6s ease-in-out infinite}
@keyframes dcb{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
</style>
</head>
<body>
<main style="min-height: 100vh; box-sizing: border-box; padding: 24px 16px; display: flex; align-items: center; justify-content: center; background-color: #0b0f1f; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(180deg, #0f2236 0%, #120f2b 60%, #22114a 100%); background-size: 44px 44px, 44px 44px, 100% 100%; font-family: 'Outfit', system-ui, sans-serif">
<section style="width: 100%; max-width: 420px; box-sizing: border-box; padding: 44px 26px 32px; border-radius: 32px; border: 1px solid rgba(255,255,255,.14); background: linear-gradient(170deg, #2f5f86 0%, #1c2b42 45%, #262650 75%, #3d2a78 100%); box-shadow: 0 30px 80px rgba(0,0,0,.5); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 26px">
<div style="position: relative; width: 180px; height: 180px; border-radius: 50%; padding: 6px; box-sizing: border-box; background: linear-gradient(140deg, #3fd3c7 0%, #4a9bea 45%, #6c4cf0 100%)">
<img src="/avatar-prop.jpg" alt="Foto del trader" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 5px solid #0d1222; box-sizing: border-box; display: block">
<div style="position: absolute; right: 4px; bottom: 10px; width: 44px; height: 44px; border-radius: 50%; background: #3d9be9; border: 4px solid #0d1222; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M21.5 3.6 2.9 10.8c-1.2.5-1.2 1.2 0 1.6l4.7 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.1-14.7c.3-1.3-.5-1.9-1.6-1.5zM9.6 14l8.6-5.4c.4-.3.8-.1.5.2l-7.1 6.4-.3 3.2-1.7-4.4z"/></svg>
</div>
</div>
<h1 style="margin: 0; font-size: 26px; line-height: 1.18; font-weight: 800; letter-spacing: -0.5px; color: #ffffff">Scopri come puoi ottenere un <span style="color: #5cc8f5">conto di Trading da oltre 100.000€</span> <span style="color: #f5f03c">senza possederli</span></h1>
<h2 style="margin: 0; font-family: 'Montserrat', sans-serif; font-size: 25px; line-height: 1.15; font-weight: 900; color: #ffffff; text-transform: uppercase">Entra all'interno del <span style="color: #8eeefc">canale Telegram</span></h2>
<div class="dc-arrow" style="width: 52px; height: 52px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M5 13l7 7 7-7"/></svg>
</div>
<div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px">
<a class="dc-cta js-tg" href="#" style="width: 100%; box-sizing: border-box; min-height: 60px; padding: 0 24px; border-radius: 999px; background: linear-gradient(90deg, #56a8ea 0%, #4c8fe6 55%, #6a42ee 100%); box-shadow: 0 10px 30px rgba(86,168,234,.35); display: flex; align-items: center; justify-content: center; gap: 14px; text-decoration: none; color: #ffffff; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 17px; letter-spacing: 1.5px; text-transform: uppercase">
<svg width="24" height="24" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M21.5 3.6 2.9 10.8c-1.2.5-1.2 1.2 0 1.6l4.7 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.1-14.7c.3-1.3-.5-1.9-1.6-1.5zM9.6 14l8.6-5.4c.4-.3.8-.1.5.2l-7.1 6.4-.3 3.2-1.7-4.4z"/></svg>
Accedi al canale</a>
<p style="margin: 0; font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 500; color: rgba(255,255,255,.85)">Accesso gratuito · Posti limitati</p>
<p id="error" role="alert" style="margin: 0; font-family: 'Montserrat', sans-serif; font-size: 13px; color: #ff8a8a"></p>
</div>
</section>
</main>
<script src="/tg-join.js"></script>
<script>
  // Meta Pixel e Clarity: ID ed evento sul clic arrivano dal server (variabili su Netlify).
  let clickEvent = "";
  fetch("/api/config")
    .then((r) => r.json())
    .then((config) => {
      const { pixelId } = config;
      clickEvent = config.clickEvent || "";
      if (/^[a-z0-9]{6,20}$/i.test(config.clarityId || "")) {
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", config.clarityId);
        clarity("set", "landing", document.documentElement.dataset.landing || "");
      }
      if (!pixelId) return;
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq("init", pixelId);
      // Extra pixels (EXTRA_PIXEL_ID): receive PageView and the click event from the browser too.
      (config.extraPixelIds || []).forEach((id) => { if (/^\d{10,20}$/.test(id)) fbq("init", id); });
      fbq("track", "PageView");
    })
    .catch(() => {});

  // Button: Telegram opens in a new page (see /tg-join.js).
  const error = document.getElementById("error");
  TGJoin.init({
    buttons: document.querySelectorAll(".js-tg"),
    getClickEvent: () => clickEvent,
    onError: () => { error.textContent = "Qualcosa non ha funzionato. Riprova tra qualche secondo."; },
  });
</script>
</body>
</html>
