<!DOCTYPE html>
<html lang="it" data-landing="classica">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il Matador 🇮🇹</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/avatar.jpg">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #111;
    background: linear-gradient(160deg, #7fb59a 0%, #a9c98f 50%, #d9d98c 100%) fixed;
  }
  .card {
    width: 100%;
    max-width: 400px;
    padding: 44px 24px 40px;
    text-align: center;
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .12);
  }
  .avatar {
    width: 122px;
    height: 122px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto 22px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 1.75rem;
    line-height: 1.2;
    font-weight: 700;
  }
  .count { margin: 0 0 18px; color: #7d7f81; font-size: 1rem; }
  .cta-text { margin: 0 0 26px; font-size: 1.15rem; }
  .button {
    display: inline-block;
    min-width: 200px;
    padding: 15px 34px;
    border: 0;
    border-radius: 999px;
    font: inherit;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: .02em;
    color: #fff;
    background: #2481cc;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .button:hover { background: #1f74b8; }
  .button:active { transform: scale(.98); }
  .button[disabled] { opacity: .7; cursor: progress; }
  .fallback { display: block; margin: 16px 0 0; font-size: .9rem; color: #2481cc; }
  .fallback[hidden] { display: none; }
  .error { min-height: 1.3em; margin: 14px 0 0; font-size: .9rem; color: #c62828; }
</style>
</head>
<body>
  <main class="card">
    <img class="avatar" src="/avatar.jpg" alt="Il Matador" width="122" height="122">
    <h1>Il Matador 🇮🇹</h1>
    <p class="count">41 932 iscritti</p>
    <p class="cta-text">Inizia ora 👇🏻</p>
    <button class="button" id="join" type="button">ACCEDI ORA</button>
    <a class="fallback" id="fallback" hidden>Telegram non si apre? Tocca qui</a>
    <p class="error" id="error" role="alert"></p>
  </main>

<script>
  // Meta Pixel: ID ed evento sul clic arrivano dal server (variabili su Netlify).
  let clickEvent = "";
  fetch("/api/config")
    .then((r) => r.json())
    .then((config) => {
      const { pixelId } = config;
      clickEvent = config.clickEvent || "";
      // Microsoft Clarity (CLARITY_ID su Netlify); ogni sessione porta il nome della landing.
      if (/^[a-z0-9]{6,20}$/i.test(config.clarityId || "")) {
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", config.clarityId);
        clarity("set", "landing", document.documentElement.dataset.landing || "");
      }
      if (!pixelId) return;
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq("init", pixelId);
      fbq("track", "PageView");
    })
    .catch(() => {});

  const button = document.getElementById("join");
  const error = document.getElementById("error");
  const fallback = document.getElementById("fallback");
  const cookie = (name) =>
    document.cookie.split("; ").find((c) => c.startsWith(name + "="))?.split("=")[1] ?? "";

  button.addEventListener("click", async () => {
    button.disabled = true;
    button.textContent = "ATTENDI…";
    error.textContent = "";
    try {
      // Same id in the browser and on the server, so Meta counts the click event once.
      const eventId = "click-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      if (clickEvent && window.fbq) fbq("track", clickEvent, {}, { eventID: eventId });
      const fbclid = new URLSearchParams(location.search).get("fbclid");
      const res = await fetch("/api/join", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          event_id: eventId,
          url: location.href,
          fbp: cookie("_fbp"),
          fbc: cookie("_fbc") || (fbclid ? `fb.1.${Date.now()}.${fbclid}` : ""),
        }),
      });
      const data = await res.json();
      if (!data.link) throw new Error("no link");
      // Open the Telegram app directly; the web link stays as a fallback below the button.
      const code = data.link.split("/").pop().replace(/^\+/, "");
      fallback.href = data.link;
      fallback.hidden = false;
      location.href = `tg://join?invite=${encodeURIComponent(code)}`;
      // If the visitor comes back to this page, the button works again.
      setTimeout(() => { button.disabled = false; button.textContent = "ACCEDI ORA"; }, 3000);
    } catch {
      error.textContent = "Qualcosa non ha funzionato. Riprova tra qualche secondo.";
      button.disabled = false;
      button.textContent = "ACCEDI ORA";
    }
  });
</script>
</body>
</html>
